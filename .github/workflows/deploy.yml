name: Export Godot 4 Web & Deploy

# main          -> https://<owner>.github.io/<repo>/
# other branch  -> https://<owner>.github.io/<repo>/preview/<branch>/
#
# Builds are pushed to the `gh-pages` branch. In repo Settings -> Pages set
# Source = "Deploy from a branch", Branch = gh-pages / (root).

on:
  push:
    branches: [ '**' ]
    paths-ignore: [ '**.md' ]
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Godot 4.7.2 (GDScript)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Work out deploy folder
        id: target
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "url_path=" >> "$GITHUB_OUTPUT"
          else
            SAFE=$(echo "$BRANCH" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
            echo "dir=preview/$SAFE" >> "$GITHUB_OUTPUT"
            echo "url_path=preview/$SAFE/" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp build
        run: echo "$(git rev-parse --short HEAD)" > build_info.txt

      - name: Import assets
        # The first import of new assets logs errors for resources that
        # reference not-yet-imported files; the export step below is the real check.
        run: godot --headless --import || true

      - name: Export Web Build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.pck

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web
          destination_dir: ${{ steps.target.outputs.dir }}
          keep_files: true
          commit_message: "Deploy ${{ github.ref_name }} @ ${{ github.sha }}"

      - name: Show URL
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          URL="https://${OWNER}.github.io/${REPO}/${{ steps.target.outputs.url_path }}"
          echo "Deployed to: $URL"
          echo "### 🎮 Play: $URL" >> "$GITHUB_STEP_SUMMARY"

  # Removes a branch's preview when the branch is deleted
  # (GitHub runs `delete` workflows from the default branch).
  remove-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Delete preview folder
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          SAFE=$(echo "$BRANCH" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
          if [ -n "$SAFE" ] && [ -d "preview/$SAFE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -rq "preview/$SAFE"
            git commit -m "Remove preview for deleted branch $BRANCH"
            git push
          else
            echo "No preview for $BRANCH"
          fi
